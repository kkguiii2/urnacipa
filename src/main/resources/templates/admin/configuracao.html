<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Configuração</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container container-admin">
        <div class="logo">
            <h1>⚙️ CONFIGURAÇÃO</h1>
        </div>

        <div class="nav-tabs">
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/usuarios}">👥 Usuários</a>
            <a th:href="@{/admin/candidatos}">🗳️ Candidatos</a>
            <a th:href="@{/admin/configuracao}" class="active">⚙️ Config</a>
            <a th:href="@{/admin/relatorio}">📄 Relatório</a>
            <form th:action="@{/admin/logout}" method="post" class="nav-logout-form">
                <button type="submit" class="nav-logout">🚪 Sair</button>
            </form>
        </div>

        <div th:if="${sucesso}" class="success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <div class="card">
            <h3>Horários da Eleição</h3>
            <form th:action="@{/admin/configuracao/salvar}" method="post" style="margin-top: 15px;"
                  th:if="${configuracao.status != 'ABERTA'}">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="dataInicio">Data de Início</label>
                        <input type="datetime-local" id="dataInicio" name="dataInicio" required
                               th:value="${configuracao.dataInicio != null ? #temporals.format(configuracao.dataInicio, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                    <div class="form-group">
                        <label for="dataFim">Data de Término</label>
                        <input type="datetime-local" id="dataFim" name="dataFim" required
                               th:value="${configuracao.dataFim != null ? #temporals.format(configuracao.dataFim, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Configuração</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Status Atual</h3>
            <div style="margin: 15px 0;">
                <span class="status-indicator" 
                      th:classappend="${configuracao.status == 'ABERTA'} ? 'status-open' : 'status-closed'">
                    <span class="status-dot"></span>
                    <span th:text="${configuracao.status}">FECHADA</span>
                </span>
            </div>
            
            <h3 style="margin-top: 20px;">Controle Manual</h3>
            <div class="btn-group" style="margin-top: 15px;">
                <form th:if="${configuracao.status != 'ABERTA'}" th:action="@{/admin/eleicao/abrir}" method="post">
                    <button type="submit" class="btn btn-success">▶️ Abrir Eleição</button>
                </form>
                <form th:if="${configuracao.status == 'ABERTA'}" th:action="@{/admin/eleicao/encerrar}" method="post">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Encerrar eleição?')">⏹️ Encerrar Eleição</button>
                </form>
            </div>
            <form th:if="${configuracao.status != 'ABERTA'}" th:action="@{/admin/eleicao/nova}" method="post"
                  style="margin-top: 20px;">
                <button type="submit" class="btn btn-secondary"
                        onclick="return confirm('Criar uma nova eleição? Os votos anteriores permanecerão no histórico.')">
                    Criar nova eleição
                </button>
            </form>
        </div>
    </div>
</body>
</html>
