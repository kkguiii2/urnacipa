<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Relatório</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container container-admin">
        <div class="logo">
            <h1>⚙️ RELATÓRIO</h1>
        </div>

        <div class="nav-tabs">
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/usuarios}">👥 Usuários</a>
            <a th:href="@{/admin/candidatos}">🗳️ Candidatos</a>
            <a th:href="@{/admin/configuracao}">⚙️ Config</a>
            <a th:href="@{/admin/relatorio}" class="active">📄 Relatório</a>
            <form th:action="@{/admin/logout}" method="post" class="nav-logout-form">
                <button type="submit" class="nav-logout">🚪 Sair</button>
            </form>
        </div>

        <div th:if="${sucesso}" class="success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <div class="card">
            <h3>Resultado Final</h3>
            <div th:if="${#lists.isEmpty(resultados)}" class="info">
                <p>Nenhum voto registrado ainda.</p>
            </div>
            <div th:each="resultado, iter : ${resultados}" class="ranking-item">
                <div class="ranking-position" th:text="${iter.index + 1} + 'º'"></div>
                <div class="ranking-info">
                    <div class="ranking-name" th:text="${resultado.nome}"></div>
                    <div class="progress-bar">
                        <div class="progress-fill" 
                             th:style="'width:' + ${resultado.percentual} + '%;'"
                             th:text="${resultado.votos} + ' voto(s)'"></div>
                    </div>
                </div>
                <div class="ranking-votes" th:text="${resultado.votos} + ' votos'"></div>
            </div>
            
            <div style="margin-top: 15px; text-align: right; color: #999;">
                <span th:text="'Total de votos: ' + ${totalVotos}"></span>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Resumo Textual</h3>
            <pre th:text="${relatorio}" style="background: #f8f9fa; padding: 20px; border-radius: 10px; 
                   white-space: pre-wrap; font-family: monospace; font-size: 14px;"></pre>
        </div>

        <div class="btn-group" style="margin-top: 20px;">
            <a th:href="@{/admin/relatorio/download}" class="btn btn-primary">📥 Download Excel</a>
            <form th:action="@{/admin/relatorio/enviar}" method="post">
                <button type="submit" class="btn btn-success" onclick="return confirm('Enviar relatório por e-mail?')">📧 Enviar por E-mail</button>
            </form>
        </div>
    </div>
</body>
</html>
