<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Candidatos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container container-admin">
        <div class="logo">
            <h1>⚙️ GESTÃO DE CANDIDATOS</h1>
        </div>

        <div class="nav-tabs">
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/usuarios}">👥 Usuários</a>
            <a th:href="@{/admin/candidatos}" class="active">🗳️ Candidatos</a>
            <a th:href="@{/admin/configuracao}">⚙️ Config</a>
            <a th:href="@{/admin/relatorio}">📄 Relatório</a>
            <a th:href="@{/admin/logout}" style="margin-left: auto;">🚪 Sair</a>
        </div>

        <div th:if="${sucesso}" class="success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <div class="card">
            <h3>Adicionar Candidato</h3>
            <form th:action="@{/admin/candidatos/adicionar}" method="post" enctype="multipart/form-data" style="margin-top: 15px;">
                <div style="display: grid; grid-template-columns: 100px 1fr; gap: 15px; align-items: start;">
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input type="number" id="numero" name="numero" required min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label for="foto">Foto do Candidato</label>
                    <input type="file" id="foto" name="foto" accept="image/*" style="padding: 10px;">
                    <img id="fotoPreview" src="#" alt="Preview" class="photo-preview" style="display:none; margin-top: 10px;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: auto; margin-top: 10px;">Adicionar</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Lista de Candidatos</h3>
            <div th:if="${#lists.isEmpty(candidatos)}" class="info" style="margin-top: 15px;">
                <p>Nenhum candidato cadastrado.</p>
            </div>
            <table class="table" th:unless="${#lists.isEmpty(candidatos)}">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Número</th>
                        <th>Nome</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="candidato : ${candidatos}">
                        <td>
                            <img th:if="${candidato.foto}" th:src="@{'/uploads/' + ${candidato.foto}}" 
                                 style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd;">
                            <span th:unless="${candidato.foto}" style="display:inline-flex; width:50px; height:50px; border-radius:50%; background:#f0f0f0; align-items:center; justify-content:center; font-size:20px;">👤</span>
                        </td>
                        <td><strong th:text="${candidato.numero}"></strong></td>
                        <td th:text="${candidato.nome}"></td>
                        <td>
                            <span class="badge" th:classappend="${candidato.ativo} ? 'badge-success' : 'badge-danger'"
                                  th:text="${candidato.ativo} ? 'Ativo' : 'Inativo'"></span>
                        </td>
                        <td>
                            <form th:action="@{/admin/candidatos/toggle/{id}(id=${candidato.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-warning" style="padding: 5px 10px; font-size: 12px;"
                                        th:text="${candidato.ativo} ? 'Desativar' : 'Ativar'"></button>
                            </form>
                            <form th:action="@{/admin/candidatos/excluir/{id}(id=${candidato.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-danger" style="padding: 5px 10px; font-size: 12px;"
                                        onclick="return confirm('Excluir candidato?')">X</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Photo preview
        document.getElementById('foto').addEventListener('change', function(e) {
            var preview = document.getElementById('fotoPreview');
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(this.files[0]);
            } else {
                preview.style.display = 'none';
            }
        });
    </script>
</body>
</html>
