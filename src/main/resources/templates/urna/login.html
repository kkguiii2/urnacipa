<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPA - Login</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🗳️ ELEIÇÃO CIPA</h1>
            <p>Sistema de Votação Eletrônica</p>
        </div>

        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <form th:action="@{/auth/verificar}" method="post">
            <div class="form-group">
                <label for="matricula">Digite sua matrícula</label>
                <input type="text" id="matricula" name="matricula" required autofocus
                       inputmode="numeric" pattern="[0-9]{1,20}" maxlength="20"
                       placeholder="Ex: 12345" autocomplete="off"
                       style="font-size: 20px; text-align: center; font-weight: 600; letter-spacing: 4px;">
            </div>
            <button type="submit" class="btn btn-primary">Continuar</button>
        </form>
    </div>
</body>
</html>
