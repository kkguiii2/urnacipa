<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPA - Confirmar</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🗳️ ELEIÇÃO CIPA</h1>
            <p>Confirme sua identidade</p>
        </div>

        <div class="user-info" style="text-align: center;">
            <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
            <h2 th:text="${nome}"></h2>
            <p style="margin-top: 10px; color: #718096;">Esta é a pessoa correta?</p>
        </div>

        <div class="btn-group">
            <form th:action="@{/auth/confirmar}" method="post" style="flex: 1;">
                <button type="submit" class="btn btn-success">✅ Sim, confirmar</button>
            </form>
            
            <form th:action="@{/auth/corrigir}" method="post" style="flex: 1;">
                <button type="submit" class="btn btn-warning">✏️ Não, corrigir</button>
            </form>
        </div>
    </div>
</body>
</html>
