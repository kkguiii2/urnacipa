<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPA - Voto Registrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container">
        <div class="success-screen">
            <div class="success-icon">✅</div>
            <h2>VOTO REGISTRADO!</h2>
            <p>Seu voto foi computado com sucesso.</p>
            <p>Obrigado por participar!</p>
            
            <div class="user-info" style="margin-top: 20px;" th:if="${candidatoNome}">
                <p th:text="'Voto em: ' + ${candidatoNome}"></p>
                <p th:text="'Número: ' + ${candidatoNumero}"></p>
            </div>
            
            <a th:href="@{/votacao/reset}" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">Nova Votação</a>
        </div>
    </div>

    <script>
        // Auto-redirect after 8 seconds for kiosk/totem mode
        setTimeout(function() {
            window.location.href = '/auth/login';
        }, 8000);
    </script>
</body>
</html>
