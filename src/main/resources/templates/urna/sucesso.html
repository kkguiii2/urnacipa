<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPA - Voto registrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <main class="container">
        <div class="success-screen">
            <div class="success-icon">✅</div>
            <h2>VOTO REGISTRADO!</h2>
            <p>Seu voto foi computado com sucesso.</p>
            <p>A cabine será bloqueada para o próximo eleitor.</p>
        </div>
    </main>
    <audio id="confirma-audio" th:src="@{/sound/confirma_urna.mp3}" preload="auto"></audio>
    <script th:inline="javascript">
        (function () {
            var loginUrl = /*[[@{/auth/login}]]*/ '/auth/login';
            var audio = document.getElementById('confirma-audio');

            function redirect() {
                window.location.replace(loginUrl);
            }

            // Redireciona assim que o som terminar
            audio.addEventListener('ended', redirect);

            // Fallback: caso o áudio não carregue/toque, redireciona após 6 segundos
            var fallback = setTimeout(redirect, 6000);

            audio.play().then(function () {
                // Som tocando normalmente — cancela o fallback fixo
                clearTimeout(fallback);
            }).catch(function () {
                // Autoplay bloqueado pelo navegador — usa o fallback
            });
        })();
    </script>
</body>
</html>
