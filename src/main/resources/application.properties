server.port=8080

# Configurações do Banco de Dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cipa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configurações de E-mail
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Propriedades da Aplicação
app.upload.path=uploads
app.email.destinatario=${EMAIL_DESTINATARIO:}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Importação administrativa de eleitores (planilha com duas colunas)
spring.servlet.multipart.max-file-size=${IMPORTACAO_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${IMPORTACAO_MAX_REQUEST_SIZE:6MB}
spring.servlet.multipart.resolve-lazily=true
app.importacao-eleitores.max-file-size-bytes=${IMPORTACAO_MAX_FILE_SIZE_BYTES:5242880}
app.importacao-eleitores.max-data-rows=${IMPORTACAO_MAX_DATA_ROWS:5000}
app.importacao-eleitores.max-expanded-size-bytes=${IMPORTACAO_MAX_EXPANDED_SIZE_BYTES:52428800}
app.importacao-eleitores.max-zip-entries=${IMPORTACAO_MAX_ZIP_ENTRIES:200}

# Sessão
server.servlet.session.timeout=30m
