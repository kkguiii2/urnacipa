spring.application.name=Sistema de Votação CIPA

# ============================================================
# Database — PostgreSQL local
# Certifique-se de que o PostgreSQL está instalado e rodando
# na máquina antes de iniciar a aplicação.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cipa}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:micro123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Mail
# ============================================================
spring.mail.host=smtp.locaweb.com.br
spring.mail.port=587
spring.mail.username=guilherme.azevedo@microservice.com.br
spring.mail.password=Gui989890.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# Server — aceita conexões de qualquer interface (LAN)
# Acesso: http://<IP_DO_SERVIDOR>:8080
# ============================================================
server.port=${PORT:8080}
server.address=0.0.0.0

# Email para envio do relatório (opcional)
app.email.destinatario=guilhermevictor0602@gmail.com

# Upload path
app.upload.path=${UPLOAD_PATH:uploads/}