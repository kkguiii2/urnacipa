server.port=8080

# Configurações do Banco de Dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cipa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA/Hibernate
# Flyway gerencia o schema — Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway — cria tabelas automaticamente na primeira inicialização
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Configurações de E-mail
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Propriedades da Aplicação
app.upload.path=uploads
app.email.destinatario=${EMAIL_DESTINATARIO:}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.mesario.username=${MESARIO_USERNAME:mesario}
app.mesario.password=${MESARIO_PASSWORD:}

# Cabine única
app.cabine.liberacao-segundos=${CABINE_LIBERACAO_SEGUNDOS:180}
app.cabine.votacao-segundos=${CABINE_VOTACAO_SEGUNDOS:600}
app.cabine.max-tentativas=${CABINE_MAX_TENTATIVAS:3}
app.cabine.username=${CABINE_USERNAME:urna}
app.cabine.password=${CABINE_PASSWORD:}

# Importação administrativa de eleitores (planilha com duas colunas)
spring.servlet.multipart.max-file-size=${IMPORTACAO_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${IMPORTACAO_MAX_REQUEST_SIZE:6MB}
spring.servlet.multipart.resolve-lazily=true
app.importacao-eleitores.max-file-size-bytes=${IMPORTACAO_MAX_FILE_SIZE_BYTES:5242880}
app.importacao-eleitores.max-data-rows=${IMPORTACAO_MAX_DATA_ROWS:5000}
app.importacao-eleitores.max-expanded-size-bytes=${IMPORTACAO_MAX_EXPANDED_SIZE_BYTES:52428800}
app.importacao-eleitores.max-zip-entries=${IMPORTACAO_MAX_ZIP_ENTRIES:200}

# Sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
