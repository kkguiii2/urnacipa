<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Usuários</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container container-admin">
        <div class="logo">
            <h1>⚙️ GESTÃO DE USUÁRIOS</h1>
        </div>

        <div class="nav-tabs">
            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/usuarios}" class="active">👥 Usuários</a>
            <a th:href="@{/admin/candidatos}">🗳️ Candidatos</a>
            <a th:href="@{/admin/configuracao}">⚙️ Config</a>
            <a th:href="@{/admin/relatorio}">📄 Relatório</a>
            <a th:href="@{/admin/logout}" style="margin-left: auto;">🚪 Sair</a>
        </div>

        <div th:if="${sucesso}" class="success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <div class="card">
            <h3>Adicionar Usuário</h3>
            <form th:action="@{/admin/usuarios/adicionar}" method="post" style="display: flex; gap: 10px; margin-top: 15px; align-items: flex-end;">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" name="matricula" placeholder="Ex: 12345" required>
                </div>
                <div class="form-group" style="flex: 2; margin-bottom: 0;">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: auto; height: fit-content;">Adicionar</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Lista de Usuários 
                <span style="font-size: 0.7em; color: #999;" th:text="'(' + ${#lists.size(usuarios)} + ' cadastrados)'"></span>
            </h3>
            <div th:if="${#lists.isEmpty(usuarios)}" class="info" style="margin-top: 15px;">
                <p>Nenhum usuário cadastrado.</p>
            </div>
            <table class="table" th:unless="${#lists.isEmpty(usuarios)}">
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Nome</th>
                        <th>Status</th>
                        <th>Votou</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td><strong th:text="${usuario.matricula}"></strong></td>
                        <td th:text="${usuario.nome}"></td>
                        <td>
                            <span class="badge" th:classappend="${usuario.ativo} ? 'badge-success' : 'badge-danger'"
                                  th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'"></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${usuario.votou} ? 'badge-success' : 'badge-warning'"
                                  th:text="${usuario.votou} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td>
                            <form th:action="@{/admin/usuarios/excluir/{id}(id=${usuario.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-danger" style="padding: 5px 10px; font-size: 12px;"
                                        onclick="return confirm('Excluir usuário?')">X</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
